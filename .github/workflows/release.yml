name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Resolve version and tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+].*)?$'; then
            echo "Invalid version '$VERSION' — expected semver like 0.1.0" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # GitHub's Windows runners check out on D: but the home dir is on C:. With
      # output:standalone, @vercel/nft globs C:\Users\runneradmin during the
      # trace and hits the deny-ACL "Application Data" junction -> EPERM, failing
      # the build. Building on the same drive as home (C:) avoids the cross-drive
      # glob. Copy excludes git/build artifacts; deps are installed fresh on C:.
      - name: Copy workspace to C drive (same drive as home)
        shell: pwsh
        run: |
          robocopy $env:GITHUB_WORKSPACE C:\rsbuild /E /XD .git node_modules .next dist /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }

      - name: Install dependencies
        working-directory: 'C:\rsbuild'
        run: npm ci

      - name: Set package version
        working-directory: 'C:\rsbuild'
        run: npm version ${{ steps.ver.outputs.version }} --no-git-tag-version --allow-same-version

      # NEXT_PUBLIC_* vars are inlined at `next build` time. Without them the
      # bundled Supabase client is constructed with undefined URL/key, which
      # throws in the auth middleware on every request (including the /start
      # readiness probe) and bricks startup ("Server returned 500"). Fail loudly
      # here rather than shipping a broken installer.
      - name: Verify required build-time config
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing required build secret $v"; missing=1; fi
          done
          if [ "$missing" != "0" ]; then
            echo "Refusing to build a release without Supabase config — it would brick startup." >&2
            exit 1
          fi

      # Provider keys are read at RUNTIME by the packaged Next server (CurseForge
      # search, Steam Workshop search) — unlike the NEXT_PUBLIC_* vars they can't
      # ride `next build`. This step writes them into packaged-env.json, which
      # electron-builder bundles into install resources and electron/main.js
      # applies on startup. Missing keys warn but don't fail: the app degrades
      # to keyless provider behavior, it never breaks.
      - name: Write packaged provider keys
        working-directory: 'C:\rsbuild'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/write-packaged-env.js

      # pwsh: `exit` is not valid inside a `( … )` subexpression, so this can't
      # collapse to the one-liner `… || (cat build.log && exit 1)`.
      #
      # Signing activates by environment alone (see scripts/make-signing-config.js
      # and docs/code-signing.md): Azure Trusted Signing when its repo variables
      # + secrets are present, a classic certificate when CSC_LINK is set,
      # unsigned exactly as before when neither is. With signing configured,
      # forceCodeSigning makes an unsigned artifact fail the build itself.
      - name: Build Windows installer
        working-directory: 'C:\rsbuild'
        env:
          DATABASE_URL: file:./dev.db
          DEBUG: electron-builder
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run electron:build > build.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content build.log; exit 1 }

      # What actually shipped must actually be signed: an Authenticode check on
      # the installer, not a hope that electron-builder's log line means it.
      - name: Verify the installer's signature
        if: always()
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ vars.EXPECT_SIGNED_INSTALLER }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          $sig = Get-AuthenticodeSignature "C:\rsbuild\dist\RealmSwap-Setup.exe"
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "(none)" }
          "Installer signature: $($sig.Status) — $subject" >> $env:GITHUB_STEP_SUMMARY
          if ($env:EXPECT_SIGNED -eq "true") {
            if ($sig.Status -ne "Valid") { throw "EXPECT_SIGNED_INSTALLER is set, but the installer is not validly signed (status: $($sig.Status))." }
            if ($env:AZURE_SIGNING_PUBLISHER -and $subject -notlike "*$($env:AZURE_SIGNING_PUBLISHER)*") {
              throw "Signed as '$subject', which does not match the configured publisher '$($env:AZURE_SIGNING_PUBLISHER)'."
            }
          } elseif ($sig.Status -eq "NotSigned") {
            Write-Host "::warning::This release is UNSIGNED — SmartScreen will warn on first run and the auto-updater cannot verify signatures. Set up signing per docs/code-signing.md and set the EXPECT_SIGNED_INSTALLER repo variable."
          }

      # Users can verify a download even before SmartScreen reputation exists.
      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          $files = "C:\rsbuild\dist\RealmSwap-Setup.exe", "C:\rsbuild\dist\RealmSwap-Setup.exe.blockmap", "C:\rsbuild\dist\latest.yml"
          $lines = $files | ForEach-Object { "{0}  {1}" -f ((Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant()), (Split-Path $_ -Leaf) }
          $lines | Set-Content -Encoding ascii C:\rsbuild\dist\SHA256SUMS.txt
          Get-Content C:\rsbuild\dist\SHA256SUMS.txt

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: C:\rsbuild\build.log

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Download **RealmSwap-Setup.exe** below and run it — the app updates itself from here on.

            ▶ **[Watch the 2-minute demo](https://github.com/RealmSwap/RealmSwap/blob/main/docs/demo/realmswap-demo.mp4)** — deploy a server, watch the boot test verify the install, then invite friends with one link.
          files: |
            C:\rsbuild\dist\RealmSwap-Setup.exe
            C:\rsbuild\dist\RealmSwap-Setup.exe.blockmap
            C:\rsbuild\dist\latest.yml
            C:\rsbuild\dist\SHA256SUMS.txt
