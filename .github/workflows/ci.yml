name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Public-surface smoke only. The authenticated flow needs E2E_EMAIL /
      # E2E_PASSWORD secrets (a real account in the app's Supabase project);
      # add them to the repo to enable it, it self-skips otherwise.
      - name: Run E2E smoke tests
        run: npx playwright test --grep @public

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Boots the production server against a throwaway DB + local fake
      # Supabase and drives real flows — including a REAL Minecraft server
      # boot (the runtimes provisioner downloads a Linux JRE). No secrets
      # needed; see scripts/e2e-api/config.ts. The CurseForge key is optional
      # and only unlocks the CF pack search/install paths (heavy scenarios
      # self-skip without it; smoke never needs it).
      - name: Run API e2e harness
        run: npm run e2e:api
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-report
          path: /tmp/realmswap-e2e-api-data/e2e-api-report.json
          retention-days: 7

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Boots the real Electron window against the same throwaway app the
      # api-e2e job builds (fake Supabase, :3100) via GAMEVAULT_DEV_URL and
      # drives the actual UI: login, first-server wizard, a REAL Minecraft
      # boot watched through the live SSE console, join-info, open-folder,
      # close-to-tray, quit. E2E_GUI_NO_SANDBOX=1 disables the Chromium
      # user-namespace sandbox, which CI runners can't use.
      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium

      - name: Run GUI e2e harness (dev pass under Xvfb)
        run: xvfb-run --auto-servernum npm run e2e:gui
        env:
          E2E_GUI_NO_SANDBOX: "1"

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gui-report
          path: /tmp/realmswap-e2e-api-data/e2e-gui-report.json
          retention-days: 7
